{% extends "base.html" %}

{% block title %}
Log In | RecipeBox
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="card login-card">

        <h1>Log In</h1>

        <p class="muted">
            Log in to add or modify recipes.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    maxlength="50"
                    autocomplete="username"
                    autocapitalize="none"
                    required
                    autofocus
                    value="{{ username or '' }}"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <label class="checkbox-label">

                <input
                    name="remember"
                    type="checkbox"
                    value="yes"
                >

                Keep me logged in

            </label>

            <div class="button-row">

                <button
                    class="button"
                    type="submit"
                >
                    Log In
                </button>

                <a
                    class="button button-secondary"
                    href="{{ url_for('main.index') }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
